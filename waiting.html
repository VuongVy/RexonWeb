<!DOCTYPE html>
<html class="dark" lang="vi">
<head>

  <title>Website đang cập nhật | REXON</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#7f13ec",
            "background-light": "#f7f6f8",
            "background-dark": "#191022",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
</head>
<body class="font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-gradient-to-b from-black from-50% to-[#191022] to-100%">
<header class="sticky top-4 z-50 mx-auto w-full max-w-5xl px-4">
<nav class="flex items-center justify-between whitespace-nowrap rounded-full border border-white/10 bg-gradient-to-r from-[#2b00ff]/30 to-[#eb00ff]/45 px-6 py-3 text-white backdrop-blur-md">
<div class="flex items-center gap-4">
<div class="size-6 text-white">
<a href="index.html">

</a>
</div>
<h2 class="text-lg font-bold leading-tight tracking-[-0.015em] text-white"></h2>
</div>
<!-- Hamburger button for mobile -->
<button id="hamburger-btn" class="md:hidden flex items-center justify-center p-2 rounded text-white focus:outline-none" aria-label="Mở menu">
  <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
  </svg>
</button>
<div class="hidden items-center gap-8 md:flex">
<a class="text-sm font-medium text-white/100 transition-colors hover:text-white" href="index.html">Home</a>
<a class="text-sm font-medium text-white/100 transition-colors hover:text-white" href="waiting.html">Solutions</a>
<a class="text-sm font-medium text-white/100 transition-colors hover:text-white" href="waiting.html">Product</a>
<a class="text-sm font-medium text-white/100 transition-colors hover:text-white" href="waiting.html">Contact Us</a>
</div>
</nav>
</header>
<main class="flex flex-grow flex-col items-center justify-center">
  <div class="relative flex flex-grow flex-col items-center justify-center gap-6 rounded-lg bg-cover bg-center bg-no-repeat w-full h-[400px] sm:h-[480px] md:h-[520px] p-4 @[480px]:gap-8 mt-16 mb-16" style="background-image: linear-gradient(to bottom, #000 0%, #000 25%, rgba(166,0,255,0.27) 100%);">
    <div class="text-center px-2 sm:px-0">
      <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-white mb-6 flex flex-col items-center justify-center gap-4">
        Rexon đang trong quá trình cập nhật
      </h1>
      <p class="text-lg text-white/80 mb-8">Để hiểu rõ hơn về năng lực và giải pháp của chúng tôi, mời Quý đối tác xem Company Profile <a href="/CompanyProfile.pdf" download class="text-primary underline font-semibold hover:text-primary/80">tại đây</a>.</p>
    </div>
  </div>
</main>
<div class="mx-auto w-full max-w-5xl">
<footer class="flex flex-col items-center gap-8 border-t border-gray-200 px-5 py-10 text-center dark:border-white/10 @container">
<div class="flex flex-col items-center gap-4 text-center text-sm text-gray-600 dark:text-gray-400">
<p>Contact: 0934 697 600 | Email: rexondigitaltwin.tech@gmail.com</p>
<p>© 2025 REXON. All rights reserved.</p> 
</div>
</footer>
</div>
</div>
<script>
  const hamburgerBtn = document.getElementById('hamburger-btn');
  const mobileMenu = document.getElementById('mobile-menu');
  if(hamburgerBtn && mobileMenu) {
    hamburgerBtn.addEventListener('click', function() {
      mobileMenu.classList.toggle('hidden');
    });
  }
</script>
</body>
</html>
